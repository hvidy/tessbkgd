[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessbkgd"
version = "2.0.0.dev0"
description = "Spatially and temporally varying background estimation for TESS target pixel files."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Tim White", email = "tim.white@sydney.edu.au" },
  { name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au" },
]
keywords = ["astronomy", "tess", "photometry", "background", "lightkurve", "jax"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "astropy>=6.0",
  "lightkurve>=2.4",
  "jax>=0.4.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/hvidy/tessbkgd"
Repository = "https://github.com/hvidy/tessbkgd"
Issues = "https://github.com/hvidy/tessbkgd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tessbkgd"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
